<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Verification | Thunder Buddies Studios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-shell">
    <main class="studio-login">
      <section class="studio-login-card">
        <img class="nav-logo" src="{{ url_for('static', filename='thunderbuddies-logo.png') }}" alt="" />
        <span class="label">Protected admin controls</span>
        <h1>Verify admin access</h1>
        <p>User permissions and economy controls require another password check.</p>
        {% if error %}
          <div class="studio-alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('admin_verify_post') }}">
          <label>
            Admin password
            <input name="password" type="password" required />
          </label>
          <button class="submit-button" type="submit">Unlock permissions</button>
        </form>
        <a class="quiet-link" href="{{ url_for('studio_dashboard') }}">Back to studio</a>
      </section>
    </main>
  </body>
</html>
