<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thunder Buddies Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050708;
        --panel: #111820;
        --line: #2d3c49;
        --text: #eef5f5;
        --muted: #9fb0b4;
        --gold: #f6c65b;
        --cyan: #47d5c3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background:
          radial-gradient(circle at top left, rgba(71, 213, 195, 0.14), transparent 22rem),
          var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 16px;
      }

      .brand {
        align-items: center;
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
      }

      img {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        max-width: 250px;
        padding: 18px;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }

      form,
      .panel {
        background: rgba(17, 24, 32, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      label {
        color: var(--muted);
        display: grid;
        font-size: 0.86rem;
        font-weight: 800;
        gap: 7px;
      }

      input,
      select {
        background: #0a1015;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        min-height: 42px;
        padding: 10px;
      }

      button {
        background: var(--gold);
        border: 0;
        border-radius: 8px;
        color: #050708;
        cursor: pointer;
        font-weight: 900;
        min-height: 44px;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      #status {
        color: var(--cyan);
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="brand">
        <img src="icon.png" alt="Thunder Buddies Studios" />
        <h1>Thunder Buddies Companion</h1>
        <p>Set Discord Rich Presence while tracking Arma Reforger mod production.</p>
      </section>

      <form id="presenceForm">
        <label>
          Project reference
          <input id="reference" placeholder="TBS-RF-1234" />
        </label>
        <label>
          Phase
          <select id="phase">
            <option>Request received</option>
            <option>Design review</option>
            <option>Work estimate</option>
            <option selected>Production</option>
            <option>Internal QA</option>
            <option>Client review</option>
            <option>Packaged delivery</option>
          </select>
        </label>
        <label>
          Progress text
          <input id="progress" placeholder="42% complete" />
        </label>
        <button type="submit">Start Rich Presence</button>
        <button class="secondary" id="stopButton" type="button">Stop Rich Presence</button>
      </form>

      <section class="panel">
        <button id="loginButton" type="button">Connect / Login to Website</button>
        <button class="secondary" id="siteButton" type="button">Open Thunder Buddies Website</button>
        <p id="status">Login opens in your browser. Rich Presence uses the public project reference API.</p>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
